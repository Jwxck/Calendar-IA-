name = "calendar-ia"
main = "worker.mjs"
compatibility_date = "2026-11-07"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]
exclude = ["worker.mjs", "wrangler.toml", "README.md", ".git/**"]

[[durable_objects.bindings]]
name = "TRANSFERS"
class_name = "TransferStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TransferStore"]
